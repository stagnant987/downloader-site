<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci pour votre achat !</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      background: #161b22;
      border: 2px solid #ff3c5c;
      border-radius: 20px;
      padding: 60px 50px;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .check {
      font-size: 5rem;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #ff3c5c;
    }

    p {
      color: #8b949e;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .download-btn {
      display: inline-block;
      background: #ff3c5c;
      color: white;
      text-decoration: none;
      padding: 18px 40px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    .download-btn:hover {
      background: #e0334f;
    }

    .note {
      margin-top: 20px;
      color: #8b949e;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="check">✅</div>
    <h1>Paiement confirmé !</h1>
    <p>Merci pour votre achat. Votre téléchargement est prêt. Cliquez sur le bouton ci-dessous pour télécharger l'application.</p>

    <a href="YT-TikTok-Downloader.exe" download class="download-btn">
      ⬇️ Télécharger l'application
    </a>

    <p class="note">Windows 10 / 11 — Paiement unique — Licence à vie</p>
  </div>
</body>
</html>
